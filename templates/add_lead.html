<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lead - ACMARKETING</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <span class="logo-text">ACMARKETING</span>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/add-lead" class="nav-link active">Add Lead</a>
                <a href="/setter-script" class="nav-link">Setter Script</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="form-section">
            <h1>Add New Lead</h1>

            <form id="add-lead-form" class="lead-form">
                <div class="form-group">
                    <label for="name">Business Name *</label>
                    <input type="text" id="name" name="name" required placeholder="Enter business name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="contact@business.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="Address">
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="City">
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" placeholder="TX" maxlength="2">
                    </div>
                </div>

                <div class="form-group">
                    <label for="qualification">Qualification Level *</label>
                    <select id="qualification" name="qualification" required>
                        <option value="unqualified">Unqualified</option>
                        <option value="low">Low Qualified</option>
                        <option value="medium">Medium Qualified</option>
                        <option value="good">Good Qualified</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="setter_notes">Talking Points / Setter Notes</label>
                    <textarea id="setter_notes" name="setter_notes" rows="4" placeholder="What should the setter bring up? Key pain points, needs, etc."></textarea>
                </div>

                <button type="submit" class="btn-primary btn-large">Add Lead</button>
            </form>

            <div id="success-message" class="success-message" style="display: none;">
                ✓ Lead added successfully! <a href="/">View in dashboard</a>
            </div>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script>
        document.getElementById('add-lead-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(document.getElementById('add-lead-form'));
            const data = {
                name: formData.get('name'),
                phone: formData.get('phone') || null,
                email: formData.get('email') || null,
                location: formData.get('location') || null,
                city: formData.get('city') || null,
                state: formData.get('state') || null,
                qualification: formData.get('qualification'),
                setter_notes: formData.get('setter_notes') || null,
            };

            try {
                const response = await fetch('/api/leads/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('success-message').style.display = 'block';
                    document.getElementById('error-message').style.display = 'none';
                    document.getElementById('add-lead-form').reset();

                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        document.getElementById('success-message').style.display = 'none';
                    }, 3000);
                } else {
                    document.getElementById('error-message').textContent = 'Error: ' + result.error;
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Error adding lead: ' + error.message;
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
